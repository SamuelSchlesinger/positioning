[package]
name = "positioning"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
rand = { version = "0.8", optional = true }
priority-queue = "2.7"
itertools = "0.14"

[features]
bevy = ["dep:bevy"]
serde = ["dep:serde"]
rand = ["dep:rand"]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "heuristic_comparison"
harness = false
